name: runner-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish, such as v1.0.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: runner-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet --info
      - run: dotnet restore Iceghost.slnx
      - run: dotnet test Iceghost.slnx --no-restore

  publish:
    needs: test
    strategy:
      matrix:
        include:
          - rid: linux-x64
            extension: tar.gz
          - rid: linux-arm64
            extension: tar.gz
          - rid: osx-x64
            extension: tar.gz
          - rid: osx-arm64
            extension: tar.gz
          - rid: win-x64
            extension: zip
          - rid: win-arm64
            extension: zip
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet --info
      - shell: bash
        run: |
          dotnet publish src/Iceghost.Runner -c Release -r "${{ matrix.rid }}" --self-contained true -p:PublishSingleFile=true -o publish
          rm -f publish/*.pdb
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            mv publish/Iceghost.Runner.exe publish/iceghost-runner.exe
          else
            mv publish/Iceghost.Runner publish/iceghost-runner
            chmod +x publish/iceghost-runner
          fi
          cp README.md publish/
          archive="iceghost-runner-${RELEASE_TAG}-${{ matrix.rid }}.${{ matrix.extension }}"
          if [[ "${{ matrix.extension }}" == "zip" ]]; then
            cd publish
            7z a "../${archive}" .
            cd ..
          else
            tar -C publish -czf "${archive}" .
          fi
          sha256sum "${archive}" > "${archive}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: iceghost-runner-${{ matrix.rid }}
          path: |
            iceghost-runner-*.tar.gz
            iceghost-runner-*.zip
            iceghost-runner-*.sha256
          if-no-files-found: error

  desktop:
    needs: test
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - shell: bash
        working-directory: electron
        run: |
          npm ci
          npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version
          npx electron-builder --publish never
      - shell: bash
        working-directory: electron/dist
        run: |
          prefix="iceghost-desktop-${RELEASE_TAG}"
          case "${{ runner.os }}" in
            Windows) mv ./*.exe "${prefix}-win-x64-setup.exe" ;;
            macOS)
              dmg=$(ls ./*.dmg | head -n1)
              arch=$([[ "$dmg" == *arm64* ]] && echo arm64 || echo x64)
              mv "$dmg" "${prefix}-mac-${arch}.dmg" ;;
            Linux) mv ./*.AppImage "${prefix}-linux-x64.AppImage" ;;
          esac
          for f in "${prefix}"-*; do
            sha256sum "$f" > "$f.sha256" 2>/dev/null || shasum -a 256 "$f" > "$f.sha256"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: iceghost-desktop-${{ runner.os }}
          path: electron/dist/iceghost-desktop-*
          if-no-files-found: error

  release:
    needs: [publish, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: iceghost-runner-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: iceghost-desktop-*
          path: release
          merge-multiple: true
      - shell: bash
        run: |
          cd release
          sha256sum --check ./*.sha256
          find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' \) -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - shell: bash
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" release/* --clobber
          else
            gh release create "${RELEASE_TAG}" release/* --verify-tag --generate-notes --title "Iceghost Runner ${RELEASE_TAG}"
          fi
