name: Build and Deploy to Docker

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
    paths-ignore: [ "README.md", "docs/**", "**/*.md" ]
  pull_request:
    branches: [ "main" ]
    paths-ignore: [ "README.md", "docs/**", "**/*.md" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    # Docker push only on pushes to main; pull requests just build the image
    - name: Compute version
      run: |
        if [ "${GITHUB_REF_TYPE}" = tag ]; then V=$GITHUB_REF_NAME; else V=$(git describe --tags --match 'v*' 2>/dev/null || echo main-${GITHUB_SHA::7}); fi
        echo "ICEGHOST_VERSION=$V" >> "$GITHUB_ENV"
    - name: Login to Docker
      if: github.event_name == 'push'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_PASS }}
    - name: Build the Docker image
      if: github.event_name == 'push'
      run: docker build --build-arg ICEGHOST_VERSION=$ICEGHOST_VERSION -t ${{ secrets.DOCKER_USER }}/iceghost:latest .
    - name: Push the docker image
      if: github.event_name == 'push'
      run: docker push ${{ secrets.DOCKER_USER }}/iceghost:latest
    - name: Build the Docker image (PR check)
      if: github.event_name != 'push'
      run: docker build --build-arg ICEGHOST_VERSION=$ICEGHOST_VERSION -t iceghost:ci .
