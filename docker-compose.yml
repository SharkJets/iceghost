services:
  iceghost:
    build: .
    image: skidvis/iceghost:latest
    env_file: .env
    environment:
      ICEGHOST_DATA: /data
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "${ICEGHOST_PORT:-8080}:8080"
    volumes:
      - iceghost-data:/data
    restart: unless-stopped

volumes:
  iceghost-data:
